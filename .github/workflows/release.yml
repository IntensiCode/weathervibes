name: Release

on:
  push:
    branches: [ release ]

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Get version
      id: version
      run: |
        VERSION=$(jq -r '"\(.major).\(.minor).\(.patch)"' version.json)
        FULL_VERSION="${VERSION}.${{ github.run_number }}"
        echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${FULL_VERSION}"
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Weather Vibes v${{ steps.version.outputs.version }}
        body: |
          Weather Vibes MATE Panel Applet
          
          Version: ${{ steps.version.outputs.version }}
          Build: ${{ github.run_number }}
          Commit: ${{ github.sha }}
          
          ## Installation
          
          Download the appropriate package for your Ubuntu version and run:
          ```bash
          tar -xzf weather-vibes-*.tar.gz
          cd weather-vibes
          sudo make install
          ```
          
          ## Changes
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/release/CHANGELOG.md) for details.
        draft: false
        prerelease: false
  
  build-release:
    needs: create-release
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        ubuntu-version: [20.04, 22.04]
    
    container:
      image: ubuntu:${{ matrix.ubuntu-version }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential \
          pkg-config \
          libgtk-3-dev \
          libmate-panel-applet-4-dev \
          libjson-glib-dev \
          libsoup2.4-dev \
          libglib2.0-dev \
          git \
          jq \
          tar \
          gzip
    
    - name: Set version in code
      run: |
        VERSION=$(jq -r '"\(.major).\(.minor).\(.patch)"' version.json)
        FULL_VERSION="${VERSION}.${{ github.run_number }}"
        echo "#define WEATHER_VIBES_VERSION \"${FULL_VERSION}\"" > src/version.h
    
    - name: Build
      run: |
        export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        make clean
        make
    
    - name: Run all tests
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
      run: |
        export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        make check
    
    - name: Create package
      run: |
        mkdir -p weather-vibes/src
        mkdir -p weather-vibes/data
        mkdir -p weather-vibes/test
        cp -r src/*.c src/*.h weather-vibes/src/
        cp -r data/* weather-vibes/data/
        cp -r test/* weather-vibes/test/
        cp Makefile weather-vibes/
        cp README.md weather-vibes/
        cp version.json weather-vibes/
        cp weather-vibes weather-vibes/weather-vibes.bin
        tar -czf weather-vibes-${{ needs.create-release.outputs.version }}-ubuntu-${{ matrix.ubuntu-version }}.tar.gz weather-vibes
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./weather-vibes-${{ needs.create-release.outputs.version }}-ubuntu-${{ matrix.ubuntu-version }}.tar.gz
        asset_name: weather-vibes-${{ needs.create-release.outputs.version }}-ubuntu-${{ matrix.ubuntu-version }}.tar.gz
        asset_content_type: application/gzip